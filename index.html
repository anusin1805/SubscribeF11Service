<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin. India Holdings MF Stock Price Ribbon and Consumer Chat</title>
    
    <!-- Razorpay Standard Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }

        #subscriptionForm {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #subscriptionForm label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #subscriptionForm input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #subscriptionForm button {
            background-color: #4caf50;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        #subscriptionForm button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div id="subscriptionForm">
        <h2>Subscribe Now!</h2>
        <!-- Form relies on Razorpay modal for payment details to ensure PCI compliance -->
        <form id="paymentForm">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            
            <label for="contact">Phone Number:</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your phone number" required>

            <button type="button" id="rzp-button" onclick="subscribe(event)">Subscribe and Pay</button>
        </form>
    </div>

    <script>
        function subscribe(e) {
            e.preventDefault();

            // 1. Capture user details from the form
            const userName = document.getElementById('fullName').value;
            const userEmail = document.getElementById('email').value;
            const userContact = document.getElementById('contact').value;

            // Basic validation
            if(!userName || !userEmail || !userContact) {
                alert("Please fill in all details before proceeding.");
                return;
            }

            // 2. Configure Razorpay Options dynamically
            var options = {
                "key": "YOUR_KEY_ID", // Replace with your actual Live or Test Key ID
                "amount": "50000", // Amount is in subunits (e.g., 50000 paise = INR 500)
                "currency": "INR",
                "name": "Fin. India Holdings", 
                "description": "Premium Mutual Fund Subscription",
                "image": "https://example.com/your_logo.png", // Add your company logo URL
                "order_id": "order_IluGWxBm9U8zJ8", // IMPORTANT: This must be dynamically generated via your backend for each transaction
                "handler": function (response){
                    // Success Callback
                    alert("Payment Successful!");
                    console.log("Payment ID: " + response.razorpay_payment_id);
                    console.log("Order ID: " + response.razorpay_order_id);
                    console.log("Signature: " + response.razorpay_signature);
                    
                    // TODO: Send these details to your server to verify the signature
                },
                "prefill": {
                    "name": userName,
                    "email": userEmail,
                    "contact": userContact
                },
                "notes": {
                    "subscription_type": "Premium Access"
                },
                "theme": {
                    "color": "#4caf50" // Matches the button color
                }
            };

            // 3. Initialize and open Razorpay
            var rzp1 = new Razorpay(options);
            
            // Handle Payment Failure
            rzp1.on('payment.failed', function (response){
                console.error(response.error.description);
                alert("Payment Failed: " + response.error.reason);
            });

            rzp1.open();
        }

        // Replace with your actual Render service URL
const RENDER_BACKEND_URL = "https://finwise-3.onrender.com"; 

async function subscribe(e) {
    e.preventDefault();

    const userName = document.getElementById('fullName').value;
    const userEmail = document.getElementById('email').value;
    const userContact = document.getElementById('contact').value;

    if (!userName || !userEmail || !userContact) {
        alert("Please fill in all details before proceeding.");
        return;
    }

    try {
        // Step 1: Call Render API to create order
        const response = await fetch(`${RENDER_BACKEND_URL}/create-order`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: 50000, currency: 'INR' })
        });

        const orderData = await response.json();

        if (!orderData.id) {
            alert("Failed to initialize payment order.");
            return;
        }

        // Step 2: Configure Razorpay Options with dynamic order_id
        var options = {
            "key": "YOUR_KEY_ID", // Your Razorpay Public Key ID
            "amount": orderData.amount,
            "currency": orderData.currency,
            "name": "Fin. India Holdings",
            "description": "Premium Subscription",
            "order_id": orderData.id, // Dynamically set from Render backend
            "handler": async function (response) {
                // Step 3: Verify payment signature on Render backend
                const verifyResponse = await fetch(`${RENDER_BACKEND_URL}/verify-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    })
                });

                const result = await verifyResponse.json();

                if (result.status === 'success') {
                    alert("Payment Verified Successfully!");
                } else {
                    alert("Payment Verification Failed!");
                }
            },
            "prefill": {
                "name": userName,
                "email": userEmail,
                "contact": userContact
            },
            "theme": {
                "color": "#4caf50"
            }
        };

        var rzp1 = new Razorpay(options);
        rzp1.on('payment.failed', function (response) {
            alert("Payment Failed: " + response.error.description);
        });
        
        rzp1.open();

    } catch (error) {
        console.error("Error launching checkout:", error);
        alert("Unable to process payment request right now.");
    }
}

    </script>
</body>
</html>
